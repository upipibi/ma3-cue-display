<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grandMA3 Cue</title>
<style>
  /* No webfont: the console has no route to the internet, so an external font
     would block paint and then fail. System stack only. */
  :root {
    --accent: #009CDE;   /* brand Light Blue. #004C97 fails WCAG AA on black. */
    --muted: #8a9099;
    --dim: #444a52;
    --fg: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    background: #0b0d10;
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .stack { text-align: center; max-width: 100%; }
  .sequence {
    font-size: clamp(1rem, 2.5vw, 2rem);
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 0.4em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cue { display: flex; align-items: baseline; justify-content: center;
         gap: 0.4em; max-width: 100%; }
  .number {
    font-size: clamp(3rem, 11vw, 9rem);
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .name {
    font-size: clamp(2rem, 7vw, 5.5rem);
    font-weight: 600;
    line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .waiting { color: var(--dim); font-weight: 400;
             font-size: clamp(1.2rem, 3.5vw, 2.4rem); }

  /* Stale: the console stopped answering, or updatedAt stopped advancing.
     Showing a cue that is no longer real is the failure that actually bites. */
  body.stale .stack { opacity: 0.25; }
  .offline {
    position: fixed; bottom: 1.2rem; left: 0; right: 0;
    text-align: center; color: #d9534f;
    font-size: clamp(0.8rem, 1.6vw, 1.1rem);
    letter-spacing: 0.08em; text-transform: uppercase;
    display: none;
  }
  body.stale .offline { display: block; }

  /* Overlay: OBS keys on the page's alpha, so the background must be fully
     transparent. The vignette keeps text legible over a camera feed. */
  body.overlay {
    background: transparent;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 0 0 4vh 4vw;
  }
  body.overlay .stack {
    text-align: left;
    background: radial-gradient(ellipse at 30% 50%,
      rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.42) 55%, transparent 82%);
    padding: 1.2em 3em 1.2em 1.5em;
    border-radius: 0.5rem;
  }
  body.overlay .cue { justify-content: flex-start; }
  body.overlay .number, body.overlay .name {
    text-shadow: 0 2px 12px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.8);
  }
  body.overlay .sequence { text-shadow: 0 1px 6px rgba(0,0,0,0.9); }

  /* Debug: the page you open when someone says it shows the wrong cue. */
  body.debug { align-items: flex-start; justify-content: flex-start;
               padding: 1.5rem; display: block; overflow: auto; }
  body.debug .stack { text-align: left; margin-bottom: 1.5rem; }
  body.debug .number { font-size: 3rem; }
  body.debug .name { font-size: 2rem; }
  .debugpanel { display: none; font-family: ui-monospace, "SF Mono", Menlo, monospace;
                font-size: 0.85rem; color: var(--muted); }
  body.debug .debugpanel { display: block; }
  .debugpanel h2 { font-size: 0.8rem; text-transform: uppercase;
                   letter-spacing: 0.1em; color: var(--accent);
                   margin: 1.2rem 0 0.4rem; }
  .debugpanel pre { white-space: pre-wrap; word-break: break-all;
                    background: #14171c; padding: 0.8rem; border-radius: 4px; }
  .debugpanel li { list-style: none; padding: 0.15rem 0; }
  /* Grid: /grid. One frame of exactly 1280 x 800, pinned to the page's top-left
     corner so an OBS crop (or a 1280 x 800 Browser source) always fits. Nothing
     in it moves: the clocks sit at the top and all eight slots are always
     drawn, empty or not. The console decides which sequence is in which slot. */
  #grid { display: none; }
  body.grid { display: block; padding: 0; overflow: auto; }
  body.grid .stack { display: none; }
  body.grid #grid {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    position: absolute; left: 0; top: 0; width: 1280px; height: 800px;
    padding: 20px; overflow: hidden; background: #0b0d10;
  }
  .g-clocks { display: flex; gap: 14px; flex: none; }
  .g-tc { width: 390px; height: 100px; flex: none; background: #14181d;
          border: 1px solid #2a3038; border-radius: 8px; padding: 10px 18px 0; }
  .g-lab { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
           color: var(--muted); white-space: nowrap; }
  .g-lab span { color: #4a5059; }
  .g-dig { font-size: 58px; font-weight: 700; line-height: 1.05; white-space: nowrap;
           font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
  .g-tc.idle .g-dig { color: #4a5059; }
  .g-slots { display: grid; grid-template-columns: 612px 612px; grid-auto-rows: 150px;
             gap: 14px; flex: none; }
  .g-slot { background: #14181d; border: 1px solid #2a3038; border-radius: 8px;
            padding: 12px 18px 14px; min-width: 0; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; }
  .g-slot.empty { background: transparent; border-color: #1b1f25; }
  .g-slot.empty > * { visibility: hidden; }
  .g-seq { font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-cue { display: flex; align-items: baseline; gap: 0.35em; min-width: 0; margin: 2px 0 10px; }
  .g-num { font-size: 52px; font-weight: 700; line-height: 1.05; color: var(--accent);
           font-variant-numeric: tabular-nums; flex: none; }
  .g-name { font-size: 38px; font-weight: 600; line-height: 1.15; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-fade { display: flex; align-items: center; gap: 12px; height: 22px; }
  .g-bar { flex: 1; height: 8px; border-radius: 4px; background: #262c34; overflow: hidden; }
  .g-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; }
  .g-slot.done .g-bar i { background: #3b4450; }
  .g-ftxt { font-size: 17px; color: var(--muted); min-width: 5.2em; text-align: right;
            white-space: nowrap; font-variant-numeric: tabular-nums; }
  .g-slot.fading .g-ftxt { color: var(--fg); font-weight: 600; }
  /* A cue with no readable fade shows no bar at all, rather than a made-up one. */
  .g-slot.nofade .g-fade { visibility: hidden; }

  /* /grid?style=overlay: transparent behind the boxes, and empty slots draw
     nothing, so the frame can sit over video. Positions are identical. */
  body.gridclear, body.gridclear #grid { background: transparent; }
  body.gridclear .g-slot.empty { border-color: transparent; }

  body.grid.stale .g-clocks, body.grid.stale .g-slots { opacity: 0.25; }
  body.grid .offline { position: absolute; left: 0; right: auto; bottom: auto; top: 384px;
                       width: 1280px; font-size: 22px; z-index: 2; }
</style>
</head>
<body>
  <div class="stack">
    <div class="sequence" id="sequence"></div>
    <div class="cue">
      <span class="number" id="number"></span>
      <span class="name waiting" id="name">Waiting for first cue</span>
    </div>
  </div>

  <div id="grid"></div>

  <div class="offline" id="offline">No data from console</div>

  <div class="debugpanel">
    <h2>Active sequences</h2>
    <ul id="dbgActive"></ul>
    <h2>Poll</h2>
    <ul id="dbgPoll"></ul>
    <h2>Raw state</h2>
    <pre id="dbgRaw">&mdash;</pre>
  </div>

<script>
(function () {
  "use strict";

  var POLL_MS = 250;
  var STALE_MS = 2000;   // 8 missed polls before we stop trusting the display

  var params = new URLSearchParams(location.search);
  var mode = location.pathname === "/debug" ? "debug"
           : location.pathname === "/grid" ? "grid"
           : (params.get("style") === "overlay" ? "overlay" : "full");
  document.body.classList.add(mode);
  if (mode === "grid" && params.get("style") === "overlay") {
    document.body.classList.add("gridclear");
  }

  var el = {
    sequence: document.getElementById("sequence"),
    number: document.getElementById("number"),
    name: document.getElementById("name"),
    offline: document.getElementById("offline"),
    dbgActive: document.getElementById("dbgActive"),
    dbgPoll: document.getElementById("dbgPoll"),
    dbgRaw: document.getElementById("dbgRaw")
  };

  // Two independent failures, each needing its own timer:
  //   lastGoodAt    -- last successful fetch. Detects an unreachable console.
  //   lastAdvanceAt -- last time updatedAt actually moved. Detects a console
  //                    that still answers HTTP while its tick loop has wedged.
  // Conflating them hides the second failure entirely, because a responding
  // server keeps lastGoodAt current no matter how stale its data is.
  // Both start at load time so the page gets one STALE_MS of grace before it
  // accuses the console of anything.
  var lastGoodAt = Date.now();
  var lastAdvanceAt = Date.now();
  var lastUpdatedAt = null;
  var stalledSince = null;
  var polls = 0, errors = 0, lastLatency = 0;

  // Cue and sequence names come from a show file, so they are untrusted text.
  // Always assign through textContent, never innerHTML.
  function setList(node, items) {
    node.textContent = "";
    if (!items.length) {
      var none = document.createElement("li");
      none.textContent = "none";
      node.appendChild(none);
      return;
    }
    items.forEach(function (text) {
      var li = document.createElement("li");
      li.textContent = text;
      node.appendChild(li);
    });
  }

  function render(s) {
    el.sequence.textContent = s.sequence || "";
    var hasCue = s.cueNumber && s.cueNumber !== "--";
    el.number.textContent = hasCue ? s.cueNumber : "";
    if (hasCue || s.cueName) {
      el.name.classList.remove("waiting");
      el.name.textContent = s.cueName || "";
    } else {
      el.name.classList.add("waiting");
      el.name.textContent = "Waiting for first cue";
    }
  }

  function renderDebug(s, raw) {
    if (mode !== "debug") return;
    setList(el.dbgActive, (s && s.activeSequences) || []);
    setList(el.dbgPoll, [
      "polls: " + polls,
      "errors: " + errors,
      "last latency: " + lastLatency + " ms",
      "server updatedAt: " + (s ? s.updatedAt : "—"),
      "stalled: " + (stalledSince === null ? "no" : "since " + stalledSince),
      "version: " + (s ? s.version : "—")
    ]);
    el.dbgRaw.textContent = raw || "—";
  }

  function refreshStale() {
    var now = Date.now();
    var unreachable = now - lastGoodAt > STALE_MS;
    var wedged = now - lastAdvanceAt > STALE_MS;
    document.body.classList.toggle("stale", unreachable || wedged);
    // Naming which failure it is turns a blank stare into a diagnosis.
    el.offline.textContent = unreachable
      ? "No data from console"
      : "Console stopped updating";
  }

  function poll() {
    var t0 = performance.now();
    // no-store, plus a cache-buster, because OBS's embedded browser is more
    // willing to cache a 200 than a normal browser is.
    fetch("/api/state?_=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (raw) {
        lastLatency = Math.round(performance.now() - t0);
        polls++;
        var s = JSON.parse(raw);
        lastGoodAt = Date.now();

        // The console answering is not the same as the console still running its
        // tick loop. If updatedAt stops advancing, the loop has wedged.
        if (s.updatedAt === lastUpdatedAt) {
          if (stalledSince === null) stalledSince = s.updatedAt;
        } else {
          stalledSince = null;
          lastUpdatedAt = s.updatedAt;
          lastAdvanceAt = Date.now();
        }

        render(s);
        if (mode === "grid") gridIngest(s, Date.now());
        refreshStale();
        renderDebug(s, raw);
      })
      .catch(function () {
        errors++;
        refreshStale();
        renderDebug(null, null);
      });
  }

  // ------------------------------------------------------------------ grid view
  // The console says what is in each of the eight slots and when each cue fired.
  // The page draws that, and between polls runs its own clock so the timecode
  // and the fade bars move smoothly instead of in 250 ms steps.
  var GRID_SLOTS = 8;
  var CLOCK_SAMPLES = 8;       // polls kept for locking a clock to the console
  var CLOCK_JUMP_S = 0.5;      // a sample this far off the running clock is a locate
  var REFIRE_MS = 500;         // a start estimate this much later is a new fire
  var gridFps = 30;
  var gridClocks = [];         // { el, lab, dig, note, slot, seconds, running, offsets, offset, shown }
  var gridSlots = [];          // { el, seq, num, name, fill, ftxt, entry, key, start }

  function mk(tag, cls, parent) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (parent) parent.appendChild(node);
    return node;
  }

  function setText(node, text) {
    if (node.textContent !== text) node.textContent = text;
  }

  function buildGrid() {
    var frame = document.getElementById("grid");
    var clocks = mk("div", "g-clocks", frame);
    var i;
    for (i = 0; i < 2; i++) {
      var tc = mk("div", "g-tc idle", clocks);
      var lab = mk("div", "g-lab", tc);
      var c = { el: tc, lab: lab, name: document.createTextNode("TC " + (i + 1)),
                note: mk("span", "", null), dig: mk("div", "g-dig", tc),
                slot: i + 1, seconds: null, running: false, offsets: [], offset: null, shown: null };
      lab.appendChild(c.name);
      lab.appendChild(c.note);
      c.dig.textContent = "--:--:--:--";
      gridClocks.push(c);
    }
    var slots = mk("div", "g-slots", frame);
    for (i = 0; i < GRID_SLOTS; i++) {
      var box = mk("div", "g-slot empty", slots);
      var seq = mk("div", "g-seq", box);
      var cue = mk("div", "g-cue", box);
      var num = mk("span", "g-num", cue);
      var name = mk("span", "g-name", cue);
      var fade = mk("div", "g-fade", box);
      var bar = mk("div", "g-bar", fade);
      var fill = mk("i", "", bar);
      var ftxt = mk("span", "g-ftxt", fade);
      // Placeholder text keeps an empty slot the same height as a full one.
      seq.textContent = "\u00a0"; num.textContent = "0"; name.textContent = "\u00a0";
      ftxt.textContent = "\u00a0";
      gridSlots.push({ el: box, seq: seq, num: num, name: name, fill: fill, ftxt: ftxt,
                       entry: null, key: null, start: null });
    }
  }

  function two(n) { return (n < 10 ? "0" : "") + n; }

  function formatTimecode(seconds, fps) {
    if (typeof seconds !== "number" || !isFinite(seconds)) return "--:--:--:--";
    var frames = Math.floor(Math.max(0, seconds) * fps + 1e-6);
    var whole = Math.floor(frames / fps);
    return two(Math.floor(whole / 3600)) + ":" + two(Math.floor(whole / 60) % 60) + ":" +
           two(whole % 60) + ":" + two(frames % fps);
  }

  function formatFade(seconds) {
    return String(Math.round(seconds * 100) / 100);
  }

  // rx is when the poll's answer arrived, in the page's own milliseconds.
  function gridIngest(s, rx) {
    var fps = Number(s.timecodeFps);
    gridFps = fps >= 1 ? Math.round(fps) : 30;

    var samples = s.timecode || [];
    gridClocks.forEach(function (c, i) {
      var t = samples[i];
      if (t && typeof t.slot === "number") {
        c.slot = t.slot;
        setText(c.name, "TC " + t.slot);
      }
      var seconds = t && typeof t.seconds === "number" ? t.seconds : null;
      var running = !!(t && t.running) && seconds !== null;
      if (running) {
        // Every answer is a little old by the time it arrives. The least delayed
        // one of the last few has the largest (console - local) offset; lock to it.
        var offset = seconds - rx / 1000;
        if (c.offset !== null && Math.abs(offset - c.offset) > CLOCK_JUMP_S) c.offsets = [];
        c.offsets.push(offset);
        if (c.offsets.length > CLOCK_SAMPLES) c.offsets.shift();
        c.offset = Math.max.apply(null, c.offsets);
      } else {
        c.offsets = [];
        c.offset = null;
      }
      c.seconds = seconds;
      c.running = running;
    });

    var grid = s.grid || [];
    gridSlots.forEach(function (g, i) {
      var e = grid[i] || null;
      if (!e) { g.entry = null; g.key = null; g.start = null; return; }
      var key = e.number + "|" + e.cueNumber;
      var estimate = typeof e.firedAgo === "number" ? rx - e.firedAgo * 1000 : null;
      if (key === g.key && g.start !== null && estimate !== null) {
        // Same cue: keep the earliest start seen (the least delayed answer),
        // unless the estimate moved clearly later, which is the cue firing again.
        g.start = estimate > g.start + REFIRE_MS ? estimate : Math.min(g.start, estimate);
      } else {
        g.start = estimate;
      }
      g.key = key;
      g.entry = e;
    });
  }

  function drawGrid() {
    var now = Date.now();
    var stale = document.body.classList.contains("stale");

    gridClocks.forEach(function (c) {
      var seconds = c.seconds;
      if (c.running && c.offset !== null) {
        // A stale page stops running the clock: it no longer knows the time.
        seconds = stale && c.shown !== null ? c.shown : now / 1000 + c.offset;
      }
      c.shown = seconds;
      setText(c.dig, formatTimecode(seconds, gridFps));
      setText(c.note, c.running ? "" : "  stopped");
      c.el.classList.toggle("idle", !c.running);
    });

    gridSlots.forEach(function (g) {
      var e = g.entry;
      g.el.classList.toggle("empty", !e);
      if (!e) {
        g.el.classList.remove("fading", "done", "nofade");
        return;
      }
      // Show-file text: textContent only.
      setText(g.seq, String(e.name == null ? "" : e.name));
      setText(g.num, String(e.cueNumber == null ? "" : e.cueNumber));
      setText(g.name, String(e.cueName == null ? "" : e.cueName));

      var fade = typeof e.fade === "number" && e.fade >= 0 ? e.fade : null;
      var fading = false, width = "100%", text = "";
      if (fade === null) {
        text = "\u00a0";
      } else if (fade === 0) {
        text = "snap";
      } else {
        var elapsed = g.start === null ? fade : (now - g.start) / 1000;
        if (elapsed < fade) {
          fading = true;
          width = (Math.max(0, elapsed) / fade * 100).toFixed(1) + "%";
          text = (fade - Math.max(0, elapsed)).toFixed(1) + " s";
        } else {
          text = "fade " + formatFade(fade) + " s";
        }
      }
      g.el.classList.toggle("nofade", fade === null);
      g.el.classList.toggle("fading", fading);
      g.el.classList.toggle("done", fade !== null && !fading);
      if (g.fill.style.width !== width) g.fill.style.width = width;
      setText(g.ftxt, text);
    });

    requestAnimationFrame(drawGrid);
  }

  if (mode === "grid") {
    buildGrid();
    requestAnimationFrame(drawGrid);
  }

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
